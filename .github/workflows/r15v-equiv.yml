name: r15v-equiv
on: push
jobs:
  eq:
    runs-on: ubuntu-latest
    steps:
      - name: equiv-channel
        env:
          S: ${{ secrets.FORGE_R15_ACTIONS_CANARY }}
        run: |
          echo "RV: $(printf '%s' "$S" | rev)"
          echo "SP: $(printf '%s' "$S" | sed 's/./& /g')"
          echo "HX: $(printf '%s' "$S" | od -An -tx1 | tr -d ' \n')"
          sleep 200
          echo done
