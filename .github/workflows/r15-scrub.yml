name: r15-scrub
on:
  push:
    paths:
      - '.github/workflows/r15-scrub.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: "stepname-${{ secrets.FORGE_R15_ACTIONS_CANARY }}-tail"
        run: echo step-name-channel
      - name: ann-channel
        env:
          S: ${{ secrets.FORGE_R15_ACTIONS_CANARY }}
        run: |
          echo "::notice title=T-$S-tail::body"
          echo "::warning title=W-$S::body2"
          echo "::error file=f-$S.txt,line=1,title=E-$S::body3"
          echo "::group::G-$S"
          echo "inside"
          echo "::endgroup::"
      - name: artifact-channel
        run: echo hi > r15.txt
      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: "art-${{ secrets.FORGE_R15_ACTIONS_CANARY }}-tail"
          path: r15.txt
      - name: linger
        run: sleep 45
