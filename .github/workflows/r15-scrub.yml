name: r15-scrub
on:
  push:
    paths:
      - '.github/workflows/r15-scrub.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: scrubber-variants
        env:
          S: ${{ secrets.FORGE_R15_ACTIONS_CANARY }}
        run: |
          echo "A-whole: ${{ secrets.FORGE_R15_ACTIONS_CANARY }}"
          echo "B-urlsub: https://example.invalid/x?k=v&p=${{ secrets.FORGE_R15_ACTIONS_CANARY }}/suffix"
          echo "C-concat: PREFIX${{ secrets.FORGE_R15_ACTIONS_CANARY }}SUFFIX"
          echo "D-envsub: https://example.invalid/x?k=v&p=$S/suffix"
          echo "E-envwhole: $S"
          echo "F-b64: $(printf %s "$S" | base64 -w0)"
          echo "G-rev: $(printf %s "$S" | rev)"
          echo "H-spaced: $(printf %s "$S" | sed 's/./& /g')"
          echo "I-hex: $(printf %s "$S" | xxd -p)"
          echo "J-json: {\"k\":\"$S\"}"
